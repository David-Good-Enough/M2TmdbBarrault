# ==========================================
# GRADLE - PERFORMANCE
# ==========================================

# Mémoire JVM : 3 Go
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Cache des résultats de compilation
org.gradle.caching=true

# Cache de configuration Gradle
org.gradle.configuration-cache=true

# Exécution parallèle des projets
org.gradle.parallel=true

# ==========================================
# KOTLIN
# ==========================================

kotlin.code.style=official